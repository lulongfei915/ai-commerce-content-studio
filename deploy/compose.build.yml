services:
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
      args:
        PYTHON_IMAGE: "${STUDIO_PYTHON_IMAGE:-python:3.12-slim}"
        UV_IMAGE: "${STUDIO_UV_IMAGE:-ghcr.io/astral-sh/uv:0.11.1}"
  edge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.edge
      args:
        NODE_IMAGE: "${STUDIO_NODE_IMAGE:-node:22-slim}"
        NGINX_IMAGE: "${STUDIO_NGINX_IMAGE:-nginx:1.28-alpine}"
