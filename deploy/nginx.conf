events {}

http {
  upstream studio_web { server web:5173; }
  upstream studio_api { server api:8000; }

  server {
    listen 80;
    location ~ ^/api/v1/files/[^/]+/upload$ {
      client_max_body_size 100m;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_pass http://studio_api;
      proxy_set_header Host $http_host;
    }
    location /api/ { proxy_pass http://studio_api; proxy_set_header Host $http_host; }
    location / { proxy_pass http://studio_web; proxy_set_header Host $host; }
  }
}
