events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format studio escape=json '{"method":"$request_method","status":$status,"seconds":$request_time}';
  access_log /dev/stdout studio;

  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream studio_api {
    zone studio_api 64k;
    server api:8000 resolve;
  }

  server {
    listen 443 ssl;
    ssl_certificate /run/studio-tls/fullchain.pem;
    ssl_certificate_key /run/studio-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    root /usr/share/nginx/html;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_next_upstream off;

    location ~ ^/api/v1/files/[^/]+/upload$ {
      client_max_body_size 100m;
      proxy_request_buffering off;
      proxy_pass http://studio_api;
    }
    location = /api/v1/ready { return 404; }
    location /api/ { proxy_pass http://studio_api; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
